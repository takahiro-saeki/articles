name: Publish scheduled article

on:
  schedule:
    # 08:55 JST (wait until 09:00), with a second attempt at 09:10 JST.
    # GitHub may start scheduled workflows later than these target times.
    - cron: "55 23 * * *"
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date in YYYY-MM-DD (JST)"
        required: false
        type: string
      dry_run:
        description: "Only show the selected entry"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: scheduled-article-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUESTED_DATE: ${{ inputs.date }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must include metadata pushed by the preceding workflow.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test publication boundaries
        run: node --test scripts/publish-scheduled.test.mjs
      - name: Select date and wait until 09:00 JST
        id: date
        run: |
          publish_date=${REQUESTED_DATE:-$(TZ=Asia/Tokyo date +%F)}
          if [[ ! "$publish_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then exit 1; fi
          echo "value=$publish_date" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = schedule ]; then
            publish_epoch=$(date -u -d "${publish_date} 00:00:00" +%s)
            current_epoch=$(date -u +%s)
            if (( current_epoch < publish_epoch )); then sleep "$((publish_epoch-current_epoch))"; fi
          fi
      - name: Prepare Zenn deployment or preview selection
        id: prepare
        env:
          PUBLICATION_DATE: ${{ steps.date.outputs.value }}
        run: |
          args=("--date=$PUBLICATION_DATE" --prepare)
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/publish-scheduled.mjs "${args[@]}"
      - name: Push Zenn request before checking the public page
        if: inputs.dry_run != true
        run: bash .github/scripts/commit-publication.sh
      - name: Publish and verify Japanese and English public pages
        id: publish
        if: inputs.dry_run != true
        env:
          PUBLICATION_DATE: ${{ steps.date.outputs.value }}
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node scripts/publish-scheduled.mjs "--date=$PUBLICATION_DATE"; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt*30))"
          done
      - name: Withdraw an unconfirmed Zenn request after failure
        if: failure() && steps.publish.outcome == 'failure'
        env:
          PUBLICATION_DATE: ${{ steps.date.outputs.value }}
        run: node scripts/publish-scheduled.mjs "--date=$PUBLICATION_DATE" --defer-zenn
      - name: Refresh the production ledger from public verification
        if: always() && inputs.dry_run != true && steps.prepare.outcome == 'success'
        run: node scripts/article-production-status.mjs
      - name: Save IDs and public verification even after partial failure
        if: always() && inputs.dry_run != true
        run: bash .github/scripts/commit-publication.sh
