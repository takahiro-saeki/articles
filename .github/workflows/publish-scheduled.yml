name: Publish scheduled article

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date in YYYY-MM-DD (JST)"
        required: false
        type: string
      dry_run:
        description: "Only show the selected entry"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: scheduled-article-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish today's Japanese and English articles
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          args=()
          if [ -n "${{ inputs.date }}" ]; then args+=("--date=${{ inputs.date }}"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=("--dry-run"); fi
          node scripts/publish-scheduled.mjs "${args[@]}"

      - name: Commit publication metadata
        if: always() && inputs.dry_run != true
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles public devto
          git commit -m "Publish scheduled article"
          git push
